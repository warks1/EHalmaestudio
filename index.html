<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#6f7743" />
  <meta name="description" content="Gestión interna de clientes de EH Alma Estudio" />
  <title>EH Alma Estudio</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Navegación principal">
      <button class="brand" data-route="inicio" aria-label="Ir al inicio">
        <img src="assets/logo.png" alt="EH Elisabet Herrera Alma Estudio" />
      </button>
      <nav id="desktopNav" class="nav-list"></nav>
      <div class="sidebar-foot">
        <p>Datos guardados en este dispositivo</p>
        <span id="storageState" class="status-pill">● Guardado local</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="mobileBrand" class="mobile-brand" data-route="inicio" aria-label="Inicio">
          <img src="assets/icon-192.png" alt="EH" />
        </button>
        <div>
          <p class="eyebrow">EH ALMA ESTUDIO</p>
          <h1 id="pageTitle">Inicio</h1>
        </div>
        <div class="top-actions">
          <button id="quickClient" class="icon-btn" title="Nuevo cliente" aria-label="Nuevo cliente">＋</button>
        </div>
      </header>

      <section id="view" class="view" aria-live="polite"></section>
    </main>

    <nav id="mobileNav" class="bottom-nav" aria-label="Navegación móvil"></nav>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-card" id="modalContent"></form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
